# Runs on every push to main and on every pull request:
#   client – clean install, ESLint, production build of the React app
#   e2e    – MongoDB in a container, seeded catalogue, the API server with the built-in
#            mock AI, then the end-to-end tests (npm run test:e2e)
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: /api

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    # CI-only values (nothing secret). server/config/env.js reads them like a .env file.
    env:
      NODE_ENV: test
      PORT: 5000
      MONGO_URI: mongodb://localhost:27017/trymate_ci
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      CLIENT_URL: http://localhost:5173
      AI_MODE: mock
      AI_SERVICE_URL: http://localhost:8000
      AI_SERVICE_KEY: ci-key
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci

      - name: Seed the catalogue
        run: npm run seed

      - name: Start the API server (mock AI)
        run: |
          nohup node index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/health; then echo; exit 0; fi
            sleep 1
          done
          echo "Server did not start"; cat server.log; exit 1

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Server log
        if: always()
        run: cat server.log || true
